
name: Build Fava Radio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Check project files
        run: |
          test -f web/package.json
          test -f web/capacitor.config.ts -o -f web/capacitor.config.json
          echo "Project files found."

      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Build web application
        working-directory: web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Prepare Android project
        working-directory: web
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Validate and set Android permissions
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          p = Path("web/android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(p)
          root = tree.getroot()

          ns = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", ns)

          permissions = [
              "android.permission.INTERNET",
              "android.permission.RECORD_AUDIO",
              "android.permission.CAMERA",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.ACCESS_FINE_LOCATION",
          ]

          existing = {
              element.get(f"{{{ns}}}name")
              for element in root.findall("uses-permission")
          }

          for permission in permissions:
              if permission not in existing:
                  element = ET.Element("uses-permission")
                  element.set(f"{{{ns}}}name", permission)
                  root.insert(0, element)

          tree.write(
              p,
              encoding="utf-8",
              xml_declaration=True
          )

          ET.parse(p)
          print("AndroidManifest.xml is valid.")
          PY

      - name: Verify Java version
        run: java -version

      - name: Build debug APK
        working-directory: web/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fava-radio-debug-apk
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
