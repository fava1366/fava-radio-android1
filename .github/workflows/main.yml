
      - name: Set Android permissions
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          p = Path("web/android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(p)
          root = tree.getroot()

          android_ns = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", android_ns)

          permissions = [
              "android.permission.INTERNET",
              "android.permission.RECORD_AUDIO",
              "android.permission.CAMERA",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.ACCESS_FINE_LOCATION",
          ]

          existing = {
              item.get(f"{{{android_ns}}}name")
              for item in root.findall("uses-permission")
          }

          for permission in permissions:
              if permission not in existing:
                  item = ET.Element("uses-permission")
                  item.set(f"{{{android_ns}}}name", permission)
                  root.insert(0, item)

          tree.write(p, encoding="utf-8", xml_declaration=True)
          ET.parse(p)
          print("AndroidManifest.xml is valid.")
          PY
